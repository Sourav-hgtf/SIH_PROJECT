version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sif_sentinel_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=false
      - SECRET_KEY=prod-secret-key-change-this-in-production-deployments-32chars
      - DATABASE_URL=sqlite:////app/data/sif_sentinel.db
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - sif_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sif_data:
