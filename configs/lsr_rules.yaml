# Canonical 12 Life-Saving Rules Configuration
# Framework: IOGP Life-Saving Rules used as the safety taxonomy for this prototype.
# Total Rules: Exactly 12 rules

rules:
  - id: "LSR01"
    name: "Bypassing Safety Controls"
    short_name: "Bypassing Controls"
    description: "Obtain authorization before overriding, disabling, or bypassing safety controls and interlocks."
    keywords:
      - "bypass"
      - "bypassed"
      - "interlock"
      - "defeated"
      - "jumpered"
      - "override"
      - "inhibited"
      - "disabled"
    phrases:
      - "bypassed interlock"
      - "safety device bypass"
      - "inhibited alarm"
      - "defeated guard"
      - "jumpered switch"
      - "override of trip"
      - "safety control disabled"
      - "alarm inhibited"
      - "trip bypass"
      - "interlock defeated"
      - "guard removed"
      - "safety relay jumpered"
      - "safety interlock"
      - "override trip"
      - "esd bypass"
    related_energy_types:
      - "mechanical"
      - "electrical"
      - "pressure"
    related_exposure_types:
      - "close proximity"
    related_barrier_types:
      - "bypass"
      - "interlock"
      - "guard"

  - id: "LSR02"
    name: "Confined Space"
    short_name: "Confined Space"
    description: "Obtain authorization and verify atmospheric testing before entering a confined space."
    keywords:
      - "confined"
      - "manway"
      - "cellar"
      - "vessel"
      - "sewer"
      - "atmosphere"
    phrases:
      - "confined space"
      - "tank entry"
      - "vessel entry"
      - "pit entry"
      - "cellar entry"
      - "no gas test"
      - "atmosphere not tested"
      - "missing attendant"
      - "cse without permit"
      - "manway entry"
      - "sewer pit"
      - "column internals"
      - "mud tank cellar"
      - "toxic atmosphere"
      - "gas testing"
    related_energy_types:
      - "chemical"
      - "thermal"
      - "pressure"
    related_exposure_types:
      - "close proximity"
    related_barrier_types:
      - "gas test"
      - "attendant"
      - "permit"

  - id: "LSR03"
    name: "Driving"
    short_name: "Driving Safety"
    description: "Follow journey management rules, wear seatbelts, obey speed limits, and avoid distractions while driving."
    keywords:
      - "speeding"
      - "seatbelt"
      - "convoy"
      - "vehicle"
      - "collision"
      - "driving"
    phrases:
