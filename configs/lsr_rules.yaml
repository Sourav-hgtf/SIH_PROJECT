    related_barrier_types:
      - "seat belt"
      - "speed limit"

  - id: "LSR04"
    name: "Energy Isolation"
    short_name: "Energy Isolation"
    description: "Verify isolation and zero energy state before work begins; apply Lock-Out/Tag-Out (LOTO)."
    keywords:
      - "isolation"
      - "isolated"
      - "loto"
      - "lockout"
      - "tagout"
      - "blind"
      - "depressurize"
    phrases:
