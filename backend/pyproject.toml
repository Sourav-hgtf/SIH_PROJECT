[project]
name = "sif-sentinel-backend"
version = "0.1.0"
requires-python = "==3.14.3"
dependencies = [
    # Required by passlib's bcrypt backend during application import.
    "bcrypt==4.0.1",
    # Must match the persisted joblib model artifact.
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# FastAPI's dependency-injection signatures intentionally use Depends(...) as
# defaults. The baseline focuses on correctness, import order, and unused code;
# exception handling is audited separately because several NLP fallbacks are
# deliberately best-effort rather than failures.
select = ["E4", "E7", "E9", "F", "I"]
